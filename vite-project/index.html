    <!-- İçerik Güvenliği Politikası. Meta ile verilebilenler burada; sunucu
         tarafi olmasi ZORUNLU olanlar (frame-ancestors, HSTS, X-Frame-Options,
         X-Content-Type-Options, Referrer-Policy, Permissions-Policy) meta ile
         calismaz — README'deki deploy bolumunde hazir bloklar var, hosting
         secilince oradan kopyalanacak.

         Direktif gerekceleri:
           style-src 'unsafe-inline' — <noscript> blogu satir ici style
             kullaniyor (React sinif adlari orada ise yaramaz). GSAP'in CSSOM
             uzerinden yazdigi stiller CSP kapsaminda DEGIL, onun icin degil.
           img-src data: — Hero'daki film grain dokusu data: URI'li SVG.
           connect-src 'self' — form gonderimi artik kendi sunucumuzdaki
             iletisim.php'ye gidiyor (eskiden api.emailjs.com'a gidiyordu ve
             ucuncu taraf izni gerekiyordu). Disaridaki hicbir adrese istek
             atilmiyor.
           frame-src youtube-nocookie — tikla-oynat video facade'i.
           media-src 'self' — hero scroll-scrub videolari. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data:;
      font-src 'self';
      media-src 'self';
      connect-src 'self';
      frame-src https://www.youtube-nocookie.com;
      form-action 'self';
      base-uri 'self';
      object-src 'none'
    " />

        <!-- Asagidaki bolumler React ile gelen icerigin metin karsiligidir.
             Prerender YERINE bu tercih edildi: hero GSAP scroll-scrub ile

        <h2 style="font-size:19px;margin:32px 0 12px">Neden AViCAD?</h2>
        <ul style="margin:0 0 24px;padding-left:20px;color:#48525f">
          <li style="margin-bottom:10px"><strong>DWG uyumu:</strong> .dwg ve .dxf dosyalarını dönüştürmeden doğrudan açar ve kaydeder; katmanlarınız, bloklarınız ve çizim geometriniz korunur.</li>
          <li style="margin-bottom:10px"><strong>Tanıdık arayüz:</strong> Komut satırı, kısayollar ve menüler AutoCAD'e çok benzer; ekibiniz yeniden eğitime gerek kalmadan çalışmaya başlar.</li>
          <li style="margin-bottom:10px"><strong>2B ve 3B tasarım:</strong> Teknik çizimden 3B modellemeye kadar mimari, makine ve mühendislik projelerini tek ortamda tamamlarsınız.</li>
          <li style="margin-bottom:10px"><strong>Uygun lisans:</strong> Kalıcı (süresiz) lisans seçeneği vardır; abonelik zorunlu değildir.</li>
          <li style="margin-bottom:10px"><strong>Yerel destek:</strong> Kurulum, eğitim, lisanslama ve teknik sorunlarda Türkçe destek sağlıyoruz.</li>
          <li><strong>Hızlı geçiş:</strong> Tanıdık arayüz ve DWG uyumu sayesinde AutoCAD'den geçiş sorunsuzdur; 30 gün ücretsiz deneyebilirsiniz.</li>
        </ul>

        <h2 style="font-size:19px;margin:0 0 12px">AViCAD ile AutoCAD LT farkı</h2>
        <p style="margin:0 0 24px;color:#48525f">
          AutoCAD LT'nin yaptığı her şeye ek olarak AViCAD; 3B modelleme, AutoLISP ile
          otomasyon, dahili mühendislik araçları (Mech-Q), 20.000'den fazla blok kütüphanesi
          ve kalıcı lisans seçeneği sunar. AutoCAD®, Autodesk, Inc.'in tescilli markasıdır;
          bu karşılaştırma genel bilgilendirme amaçlıdır.
        </p>

        <h2 style="font-size:19px;margin:0 0 12px">Sıkça sorulan sorular</h2>
        <dl style="margin:0 0 28px;color:#48525f">
          <dt style="font-weight:600;margin-bottom:4px">Mevcut .dwg dosyalarım sorunsuz açılır mı?</dt>
          <dd style="margin:0 0 14px 0">Evet. AViCAD .dwg ve .dxf dosyalarını dönüştürmeye gerek kalmadan açar ve kaydeder.</dd>
          <dt style="font-weight:600;margin-bottom:4px">Geçiş zor mu, yeniden eğitim gerekir mi?</dt>
          <dd style="margin:0 0 14px 0">Hayır. Komutlar ve menüler AutoCAD'e benzer; çoğu kullanıcı ilk günden verimli çalışır.</dd>
          <dt style="font-weight:600;margin-bottom:4px">Lisans kalıcı mı, abonelik mi?</dt>
          <dd style="margin:0 0 14px 0">İkisi de mevcut. Tek seferlik ödemeyle süresiz lisans alabilir ya da abonelik seçebilirsiniz.</dd>
          <dt style="font-weight:600;margin-bottom:4px">Satın almadan önce deneyebilir miyim?</dt>
          <dd style="margin:0 0 14px 0">Evet, 30 gün boyunca ücretsiz ve taahhütsüz deneyebilirsiniz.</dd>
          <dt style="font-weight:600;margin-bottom:4px">Destek Türkçe mi?</dt>
          <dd style="margin:0">Evet. Türkiye distribütörü olarak kurulumdan lisanslamaya kadar yerel ve Türkçe destek veriyoruz.</dd>
