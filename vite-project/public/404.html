<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Sayfa Bulunamadı — AViCAD Türkiye</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face {
    font-family: 'Plex Sans';
    src: url('/blog/fonts/ibm-plex-sans-var-latin-ext.woff2') format('woff2');
    font-weight: 100 700; font-display: swap;
  }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(120% 130% at 50% 0%, #14243a 0%, #0c1727 50%, #070f1b 100%);
    color: #eaf1f8; font-family: 'Plex Sans', system-ui, -apple-system, sans-serif;
    padding: 40px 24px; gap: 8px;
  }
  img { width: 84px; height: auto; margin-bottom: 22px; filter: drop-shadow(0 6px 20px rgba(0,0,0,.5)); }
  .kod { font-size: clamp(64px, 16vw, 120px); font-weight: 700; line-height: 1; letter-spacing: -0.03em;
    color: #0693e3; text-shadow: 0 0 60px rgba(6,147,227,.35); }
  h1 { font-size: clamp(20px, 4vw, 27px); font-weight: 600; margin: 12px 0 6px; }
  p { color: #9fb0c2; font-size: 16px; max-width: 420px; line-height: 1.6; margin-bottom: 28px; }
  a.btn { display: inline-block; background: #0693e3; color: #fff; text-decoration: none;
    font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 15px 34px; border-radius: 9px; transition: background .2s; }
  a.btn:hover { background: #0a6aa8; }
  .marka { margin-top: 40px; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: #5a6b7c; }
</style>
</head>
<body>
  <img src="/logo.webp" width="144" height="147" alt="AViCAD Türkiye">
  <div class="kod">404</div>
  <h1>Aradığınız sayfa bulunamadı</h1>
  <p>Sayfa taşınmış ya da hiç var olmamış olabilir. AViCAD Türkiye ana sayfasından devam edebilirsiniz.</p>
  <a class="btn" href="/">Ana Sayfaya Dön</a>
  <div class="marka">AViCAD Türkiye</div>
</body>
</html>
